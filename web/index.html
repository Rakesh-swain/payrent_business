  <!-- Twitter Card Meta Tags -->

  <meta name="twitter:description" content="Streamline your property management and rent collection.">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  
  <title>PayRent - Property Management Platform</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Custom CSS for loading screen -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #7869E6 0%, #4F287D 100%);
      overflow: hidden;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-text {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .loading-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 400;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-logo">
      <span style="font-size: 32px; color: white;">🏠</span>
    </div>
    <div class="loading-text">PayRent</div>
    <div class="loading-subtitle">Property Management Made Easy</div>
    <div class="loading-spinner"></div>
  </div>
  
    <!-- Flutter App -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loadingElement = document.getElementById('loading');
      loadingElement.classList.add('hide');
      setTimeout(() => {
        loadingElement.style.display = 'none';
      }, 500);
    });
  </script>



  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
